<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="ghostGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="ghostBodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#d4b2ff" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#9d4edd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5a189a" stop-opacity="0.4" />
    </radialGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0aaff" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#7b2cbf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3c096c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Spectral outer aura -->
  <circle cx="50" cy="50" r="46" fill="url(#auraGrad)" />

  <!-- Ghost Wisp Body -->
  <g filter="url(#ghostGlow)">
    <path d="M50 14
             C68 14, 82 28, 82 48
             C82 62, 74 74, 66 86
             C62 82, 58 84, 54 88
             C50 82, 46 84, 42 88
             C38 82, 34 83, 30 87
             C24 77, 18 64, 18 48
             C18 28, 32 14, 50 14 Z"
          fill="url(#ghostBodyGrad)" />

    <!-- Ghost Wispy Tail Swoosh -->
    <path d="M30 87 C22 93, 12 91, 8 83 C14 85, 20 83, 24 77 Z" fill="#9d4edd" opacity="0.6" />

    <!-- Phantom Cute Eyes -->
    <ellipse cx="40" cy="44" rx="5.5" ry="7.5" fill="#240046" />
    <circle cx="38.5" cy="42" r="2.2" fill="#ffffff" />
    <circle cx="41.5" cy="46" r="1" fill="#e0aaff" />

    <ellipse cx="60" cy="44" rx="5.5" ry="7.5" fill="#240046" />
    <circle cx="58.5" cy="42" r="2.2" fill="#ffffff" />
    <circle cx="61.5" cy="46" r="1" fill="#e0aaff" />

    <!-- Cute Ghost Mouth -->
    <path d="M46 56 Q50 62 54 56" stroke="#240046" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Rosy Cheek Blushes -->
    <circle cx="33" cy="52" r="3.5" fill="#ff70a6" opacity="0.6" />
    <circle cx="67" cy="52" r="3.5" fill="#ff70a6" opacity="0.6" />

    <!-- Ethereal wisps / flames -->
    <path d="M50 20 Q53 10 57 16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
